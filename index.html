<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>SBU PIK - Kamera Absensi</title>


  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    :root {
      --navy: #073b67;
      --blue: #078db5;
      --teal: #00a49a;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --danger: #ffb4ab;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 88% 8%, rgba(7,153,200,.28), transparent 34%),
        radial-gradient(circle at 8% 90%, rgba(0,164,154,.20), transparent 30%),
        linear-gradient(145deg, #041f38 0%, #063d67 55%, #006f97 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .camera-app {
      width: min(410px, 100%);
      height: calc(100vh - 16px);
      max-height: calc(100vh - 16px);
      padding: 14px;
      border-radius: 15px;
      overflow: hidden;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 30px 70px rgba(0,0,0,.26);
      backdrop-filter: blur(12px);
    }

    .brand {
      text-align: center;
      margin-bottom: 5px;
    }

    .brand-label {
      color: #83d8dc;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    h1 {
      margin-top: 6px;
      font-size: 20px;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.5;
    }

    .camera-frame {
      position: relative;
      width: 100%;
      height: 220px;
      overflow: hidden;
      border-radius: 14px;
      background: #071828;
      border: 1px solid rgba(255,255,255,.18);
    }

    video,
    canvas,
    .photo-preview {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    video {
      transform: scaleX(-1);
      background: #071828;
    }

    canvas,
    .photo-preview {
      display: none;
    }

    .state {
      min-height: 36px;
      margin-top: 6px;
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.5;
      text-align: center;
    }

    .gps {
      display: none;
      margin-top: 5px;
      padding: 7px 9px;
      border-radius: 9px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      color: #dce7f1;
      font-size: 10px;
      line-height: 1.4;
    }

    .gps.show { display: none; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 7px;
    }

    button {
      height: 38px;
      border: 0;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .secondary {
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.17);
      color: #e2e8f0;
    }

    .primary {
      color: #fff;
      background: linear-gradient(100deg, #063b67, #0799c8);
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .error {
      min-height: 20px;
      margin-top: 6px;
      color: var(--danger);
      font-size: 10.5px;
      line-height: 1.5;
      text-align: center;
    }


    .location-panel {
      margin-top: 7px;
      padding: 7px;
      border-radius: 12px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
    }

    .location-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 5px;
    }

    .location-title {
      color: #f8fafc;
      font-size: 10.5px;
      font-weight: 700;
    }

    .location-accuracy {
      color: #a9bfd0;
      font-size: 9px;
    }

    #liveMap {
      width: 100%;
      height: 135px;
      border-radius: 9px;
      overflow: hidden;
      background: #0b1c2b;
      border: 1px solid rgba(255,255,255,.10);
    }

    .leaflet-control-attribution {
      font-size: 7px !important;
    }

    .coordinates {
      margin-top: 5px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .coordinate-item {
      min-width: 0;
      padding: 6px 7px;
      border-radius: 8px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.09);
    }

    .coordinate-label {
      color: #8fb0c7;
      font-size: 8px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .coordinate-value {
      margin-top: 2px;
      color: #f8fafc;
      font-size: 9px;
      font-weight: 600;
      word-break: break-all;
    }

    @media (max-width: 520px) {
      #liveMap {
        height: 125px;
      }
      body { padding: 6px; }
      .camera-app {
        width: 100%;
        height: calc(100vh - 12px);
        max-height: calc(100vh - 12px);
        padding: 11px;
        border-radius: 13px;
      }
      .camera-frame { height: 190px; }
      h1 { font-size: 19px; }
    }
  </style>
</head>

<body>
  <main class="camera-app">

    <header class="brand">
      <div class="brand-label">SBU PIK</div>
      <h1>Foto Absensi</h1>
      <p class="subtitle">
        Posisikan wajah dengan jelas. Kamera dan GPS akan digunakan
        untuk bukti kehadiran.
      </p>
    </header>

    <section class="camera-frame">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <img id="photoPreview" class="photo-preview" alt="Foto absensi">
    </section>

    <div class="state" id="state">
      Menyiapkan kamera...
    </div>

    <div class="gps" id="gps"></div>

    <section class="location-panel" aria-label="Lokasi saat ini">
      <div class="location-header">
        <span class="location-title">Lokasi Saat Ini</span>
        <span class="location-accuracy" id="locationAccuracy">Menunggu GPS...</span>
      </div>

      <div id="liveMap"></div>

      <div class="coordinates">
        <div class="coordinate-item">
          <div class="coordinate-label">Latitude</div>
          <div class="coordinate-value" id="latitudeValue">-</div>
        </div>

        <div class="coordinate-item">
          <div class="coordinate-label">Longitude</div>
          <div class="coordinate-value" id="longitudeValue">-</div>
        </div>
      </div>
    </section>


    <div class="error" id="error"></div>

    <div class="actions">
      <button class="secondary" id="cancelButton" type="button">
        Batal
      </button>

      <button class="primary" id="captureButton" type="button" disabled>
        Ambil Foto
      </button>

      <button class="secondary" id="retakeButton" type="button" style="display:none">
        Foto Ulang
      </button>

      <button class="primary" id="confirmButton" type="button" style="display:none">
        Konfirmasi Absen
      </button>
    </div>

  </main>


  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <script>
    const token =
      new URLSearchParams(location.search).get('token') || '';

    const mode =
      new URLSearchParams(location.search).get('mode') === 'checkout'
        ? 'checkout'
        : 'checkin';

    const attendanceType = mode;

    const pageTitle =
      mode === 'checkout'
        ? 'Foto Absen Pulang'
        : 'Foto Absen Masuk';

    const headerTitle =
      document.querySelector('h1');

    if (headerTitle) {
      headerTitle.textContent = pageTitle;
    }

    const subtitle =
      document.querySelector('.subtitle');

    if (subtitle) {
      subtitle.textContent =
        mode === 'checkout'
          ? 'Ambil foto sebagai bukti absen pulang. Pastikan wajah terlihat jelas.'
          : 'Ambil foto sebagai bukti absen masuk. Pastikan wajah terlihat jelas.';
    }



    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const photoPreview = document.getElementById('photoPreview');
    const state = document.getElementById('state');
    const gpsBox = document.getElementById('gps');
    const errorBox = document.getElementById('error');

    const cancelButton = document.getElementById('cancelButton');
    const captureButton = document.getElementById('captureButton');
    const retakeButton = document.getElementById('retakeButton');
    const confirmButton = document.getElementById('confirmButton');

    let stream = null;
    let photoDataUrl = null;
    let latitude = null;
    let longitude = null;

    let map = null;
    let locationMarker = null;
    let accuracyCircle = null;
    let geoWatchId = null;



    function setError(text) {
      errorBox.textContent = text || '';
    }

    function stopCamera() {
      stopLocationWatch();

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
    }


    function initLiveMap() {
      if (map || typeof L === 'undefined') {
        return;
      }

      map = L.map('liveMap', {
        zoomControl: false,
        attributionControl: true
      }).setView([-6.200000, 106.816666], 10);

      L.control.zoom({
        position: 'bottomright'
      }).addTo(map);

      L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
          maxZoom: 19,
          attribution:
            '&copy; OpenStreetMap contributors'
        }
      ).addTo(map);
    }

    function updateLiveLocation(position) {
      latitude = position.coords.latitude;
      longitude = position.coords.longitude;

      const accuracy =
        Number(position.coords.accuracy || 0);

      document.getElementById('latitudeValue')
        .textContent = latitude.toFixed(7);

      document.getElementById('longitudeValue')
        .textContent = longitude.toFixed(7);

      document.getElementById('locationAccuracy')
        .textContent =
          accuracy > 0
            ? 'Akurasi ±' + Math.round(accuracy) + ' m'
            : 'GPS aktif';

      document.getElementById('gps').classList.add('show');

      document.getElementById('gps').innerHTML =
        '<strong>GPS aktif</strong><br>' +
        'Lokasi terus diperbarui selama kamera aktif.';

      initLiveMap();

      const point = [
        latitude,
        longitude
      ];

      if (!locationMarker) {
        locationMarker =
          L.marker(point, {
            title: 'Lokasi Anda'
          }).addTo(map);

        locationMarker.bindPopup(
          '<strong>Lokasi Anda</strong><br>' +
          'Lat: ' + latitude.toFixed(7) + '<br>' +
          'Lng: ' + longitude.toFixed(7)
        );
      } else {
        locationMarker.setLatLng(point);

        locationMarker.setPopupContent(
          '<strong>Lokasi Anda</strong><br>' +
          'Lat: ' + latitude.toFixed(7) + '<br>' +
          'Lng: ' + longitude.toFixed(7)
        );
      }

      if (!accuracyCircle) {
        accuracyCircle =
          L.circle(
            point,
            {
              radius: accuracy || 20,
              color: '#0799c8',
              fillColor: '#0799c8',
              fillOpacity: 0.15,
              weight: 1
            }
          ).addTo(map);
      } else {
        accuracyCircle.setLatLng(point);
        accuracyCircle.setRadius(
          accuracy || 20
        );
      }

      map.setView(point, 17, {
        animate: true
      });
    }

    function startLocationWatch() {
      if (!navigator.geolocation) {
        setError(
          'Browser tidak mendukung GPS.'
        );
        document.getElementById('locationAccuracy')
          .textContent = 'GPS tidak tersedia';
        return;
      }

      initLiveMap();

      if (geoWatchId !== null) {
        navigator.geolocation.clearWatch(
          geoWatchId
        );
      }

      geoWatchId =
        navigator.geolocation.watchPosition(
          function(position) {
            updateLiveLocation(position);
          },
          function(error) {
            if (error.code === 1) {
              setError(
                'Akses GPS ditolak. Izinkan Location pada halaman kamera.'
              );
            } else if (error.code === 2) {
              setError(
                'Lokasi tidak tersedia.'
              );
            } else if (error.code === 3) {
              setError(
                'Pengambilan lokasi terlalu lama.'
              );
            }

            document.getElementById(
              'locationAccuracy'
            ).textContent =
              'Menunggu GPS...';
          },
          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
          }
        );
    }

    function stopLocationWatch() {
      if (geoWatchId !== null) {
        navigator.geolocation.clearWatch(
          geoWatchId
        );
        geoWatchId = null;
      }
    }

    async function startCamera() {
      setError('');

      if (!window.isSecureContext) {
        setError(
          'Halaman kamera harus dibuka melalui HTTPS.'
        );
        state.textContent = 'Kamera tidak dapat digunakan.';
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setError(
          'Browser tidak mendukung kamera live.'
        );
        state.textContent = 'Kamera tidak tersedia.';
        return;
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'user' },
            width: { ideal: 720 },
            height: { ideal: 960 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        captureButton.disabled = false;

        state.textContent =
          'Kamera aktif. Posisikan wajah dengan jelas, lalu klik Ambil Foto.';

        startLocationWatch();
      } catch (error) {
        if (error && error.name === 'NotAllowedError') {
          setError(
            'Akses kamera ditolak. Izinkan kamera pada halaman ini, lalu muat ulang.'
          );
        } else if (error && error.name === 'NotFoundError') {
          setError(
            'Kamera tidak ditemukan pada perangkat.'
          );
        } else {
          setError(
            'Kamera gagal dibuka: ' +
            (error && error.message ? error.message : 'unknown error')
          );
        }

        state.textContent =
          'Kamera belum berhasil diaktifkan.';
      }
    }

    function capturePhoto() {
      setError('');

      if (!video.videoWidth || !video.videoHeight) {
        setError('Kamera belum siap.');
        return;
      }

      const maxWidth = 720;
      const scale =
        Math.min(1, maxWidth / video.videoWidth);

      canvas.width =
        Math.round(video.videoWidth * scale);

      canvas.height =
        Math.round(video.videoHeight * scale);

      const ctx =
        canvas.getContext('2d');

      ctx.save();
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );
      ctx.restore();

      photoDataUrl =
        canvas.toDataURL('image/jpeg', 0.80);

      photoPreview.src = photoDataUrl;
      photoPreview.style.display = 'block';
      video.style.display = 'none';

      captureButton.style.display = 'none';
      retakeButton.style.display = 'block';
      confirmButton.style.display = 'block';

      state.textContent =
        'Foto sudah diambil. Periksa foto sebelum konfirmasi.';

      stopCamera();
    }

    function retakePhoto() {
      photoDataUrl = null;
      photoPreview.style.display = 'none';
      video.style.display = 'block';

      retakeButton.style.display = 'none';
      confirmButton.style.display = 'none';
      captureButton.style.display = 'block';
      captureButton.disabled = true;

      startCamera();
    }

    function confirmAttendance() {
      if (!photoDataUrl) {
        setError('Foto belum diambil.');
        return;
      }

      if (
        !Number.isFinite(latitude) ||
        !Number.isFinite(longitude)
      ) {
        setError(
          'GPS belum tersedia. Tunggu GPS siap lalu coba lagi.'
        );
        startLocation();
        return;
      }

      confirmButton.disabled = true;
      retakeButton.disabled = true;
      cancelButton.disabled = true;

      state.textContent =
        'Mengirim foto dan lokasi ke aplikasi...';

      const message = {
        source: 'sbu-pik-live-camera',
        type: 'attendance-photo',
        attendanceType: attendanceType,
        token: token,
        photoDataUrl: photoDataUrl,
        latitude: latitude,
        longitude: longitude
      };

      if (window.parent && window.parent !== window) {
        window.parent.postMessage(message, '*');
      } else if (window.opener) {
        window.opener.postMessage(message, '*');
      }

      setTimeout(() => {
        state.textContent =
          'Data dikirim ke aplikasi.';
        stopCamera();
      }, 600);
    }

    cancelButton.addEventListener('click', () => {
      const message = {
        source: 'sbu-pik-live-camera',
        type: 'camera-cancelled',
        token: token
      };

      if (window.parent && window.parent !== window) {
        window.parent.postMessage(message, '*');
      } else if (window.opener) {
        window.opener.postMessage(message, '*');
      }

      stopCamera();
      window.close();
    });

    captureButton.addEventListener('click', capturePhoto);
    retakeButton.addEventListener('click', retakePhoto);
    confirmButton.addEventListener('click', confirmAttendance);

    window.addEventListener('beforeunload', stopCamera);

    startCamera();
  </script>
</body>
</html>
